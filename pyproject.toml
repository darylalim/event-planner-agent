[project]
name = "event-planner-agent"
version = "0.1.0"
description = "Event planning agent on Deep Agents"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents>=0.7.1",
    "langchain-anthropic>=1.5.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.10.15",
    "python-dotenv>=1.0.1",
]

[project.scripts]
event-planner = "event_planner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_planner"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
