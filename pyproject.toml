[project]
name = "event-planner-agent"
version = "0.2.0"
description = "Event planning agent on Deep Agents for driving an event brief to a bookable plan."
readme = "README.md"
requires-python = ">=3.11,<4.0"
# PEP 639: an SPDX expression plus the file to ship in the wheel's metadata.
# Needs hatchling >= 1.27, which `[build-system]` gets by leaving the version
# open. Do not also add a `License ::` classifier — the two forms conflict.
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "deepagents>=0.7.9",
    "langchain-anthropic>=1.6.1",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.11.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
event-planner = "event_planner.cli:main"

[project.optional-dependencies]
web = [
    "streamlit>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_planner"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Self-reference to the `web` extra, so a development checkout gets the
    # front end from `uv sync` alone: the suite drives the real page through
    # Streamlit's AppTest, and CI runs a plain `uv sync --locked`. What this
    # does NOT do is put Streamlit in the built package — `langgraph.json`
    # installs `.` with no extras, so the deployed graph, which never imports
    # it, no longer ships it or its ~27 transitive dependencies.
    "event-planner-agent[web]",
]

[tool.uv]
# uv is the one tool this project's CI did not pin, having pinned ruff, ty and
# both action SHAs on the argument that an upstream release must not redden CI
# on code nobody touched — while leaving it live for the tool that resolves the
# lockfile and provisions every interpreter. `astral-sh/setup-uv` with no
# `version:` input reads this key (verified in action.yml at the pinned SHA), so
# one copy pins the runner and the checkout alike.
#
# Measured scope, because "every uv command" would be wrong: this gates the
# project-aware ones — `uv sync`, `uv run`, `uv lock`, `uv pip` — with "Required
# uv version `==0.12.5` does not match the running version", which is every
# runnable line in CLAUDE.md's Commands block except the three `uvx` ones. Tool
# runs are NOT gated: `uvx ruff@0.16.1` works on any uv, so this and the ruff/ty
# pins do not overlap. Nor is `uv self update`, which is deliberate — it is how
# a contributor gets back in step. Bump this alongside the two pins in
# .claude/hooks/lint_gate.sh rather than by drifting into it.
required-version = "==0.12.5"

# Ruff is deliberately NOT a dependency — run `uvx ruff check .` and
# `uvx ruff format`. Both are enforced by CI (.github/workflows/ci.yml), which
# runs `format --check`; the tree was formatted in the commit that added that
# step. Rationale for the choices below lives in CLAUDE.md; keep it there
# rather than restating it, so the two cannot drift.
[tool.ruff]
# Ruff's default is 88, so this is a deliberate loosening, fitted to the code:
# the longest existing line is 99. Chosen so E501 can be enabled as a live rule
# instead of being ignored, at the cost of a limit slightly wider than the code
# actually uses. It also drives the formatter, which joins any wrapped
# expression that fits within it — which is how that longest line reached 99.
line-length = 100

[tool.ruff.lint]
# BLE is here so the three `# noqa: BLE001` directives in the source suppress a
# rule that is actually enabled, and RUF (which carries RUF100) fails the check
# if one of them ever goes stale.
select = ["E", "F", "I", "UP", "B", "BLE", "ANN", "RUF"]
# `Any` is deliberate at the deepagents/langgraph boundary: `create_deep_agent`
# returns an untyped compiled graph and the runtime passed to the namespace
# factories has no public type. Annotating them honestly means `Any`.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# ANN: test fixtures are untyped by convention.
# RUF012: the fake models subclass `GenericFakeChatModel`, which is a Pydantic
# BaseModel, so `replies: list[AIMessage] = []` is a field that Pydantic
# deep-copies per instance — not a shared mutable class default. Ruff cannot
# see through the base class to tell the difference.
"tests/*" = ["ANN", "RUF012"]

# ty is likewise not a dependency — run it with `uvx ty check`. It infers the
# target version from `requires-python`, so it checks against 3.11, the floor
# this project claims, NOT the 3.14 in `.python-version`. That is the useful
# direction: it catches 3.12+ syntax or APIs that would break the declared
# minimum. Only the rule below is raised above ty's defaults; the defaults
# already pass, so restating them here would be config that checks nothing.
[tool.ty.rules]
# Bare `dict`/`tuple`/`list` annotations. Off by default, and it found three
# real ones. `missing-override-decorator` is deliberately NOT enabled: it wants
# `@override` on the test fakes, which on 3.11 means importing
# `typing_extensions` — available only transitively here, so honouring the rule
# would mean declaring a new dependency to annotate four test methods.
missing-type-argument = "error"
