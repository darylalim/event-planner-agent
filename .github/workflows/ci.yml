# CI runs the checks that fire locally as Claude Code PostToolUse hooks (see
# .claude/hooks/README.md), so a contributor without Claude Code gets the same
# feedback the author gets at edit time:
#
#   ruff check      lint_gate.sh
#   ty check        lint_gate.sh
#   pytest          test_gate.sh
#   prompt drift    check_prompt_drift.py
#   ruff format     no local counterpart yet — see below
#
# It does NOT stand in for the three PreToolUse guards (guard_workspace.sh,
# protect_files.sh, guard_bash.sh), which block writes rather than inspect
# them. Nothing here reproduces those: a pull request that parks client data
# under workspace/ is refused on the author's machine and green here.
#
# `ruff format --check` is the one check with no hook behind it — lint_gate.sh
# still runs `check` only. Adding it there is an operator edit, because
# protect_files.sh guards .claude/ against writes from inside a session.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseding an in-flight run is free on a pull request. Not on main: the
  # README badge reports the default branch, so cancelling there can leave the
  # badge reading "cancelled" on a commit that was never actually verified.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No job writes to the repo, comments on a PR, or publishes an artifact.
permissions:
  contents: read

env:
  # Must match .claude/hooks/lint_gate.sh, which pins the same two versions for
  # the reason recorded there: an upstream release must not redden CI on code
  # nobody touched. These are a second copy of those pins, so the static job
  # asserts the two agree rather than trusting a comment to keep them in step.
  RUFF: ruff@0.16.1
  TY: ty@0.0.65

jobs:
  static:
    name: lint · format · types · drift
    runs-on: ubuntu-latest
    # The slowest step here is the install; the checks are milliseconds. This
    # is a stuck-runner backstop, not a budget.
    timeout-minutes: 10
    steps:
      # Actions are pinned to the commit behind the release tag — the form
      # upstream's own README uses. Not a major-only ref: setup-uv publishes
      # v9.0.0 but no floating v9, so `@v9` fails to resolve and every job
      # aborts before doing any work. A SHA also cannot be force-moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No python-version here: uv reads .python-version (3.14) and provisions
      # that interpreter itself. Caching needs no configuration — enable-cache
      # defaults to "auto", which resolves to true on GitHub-hosted runners,
      # and the default cache-dependency-glob already covers uv.lock.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # Both ruff steps run BEFORE the install, deliberately: ruff goes through
      # uvx in an isolated environment and never touches .venv. A stale
      # lockfile is the likeliest reason this job fails, and it should not also
      # cost the contributor their lint and format feedback.
      - name: Lint (ruff)
        run: uvx "$RUFF" check .

      # --check never writes; it exits non-zero on any file `ruff format` would
      # change. Runs even when the linter is red so one cannot hide the other.
      - name: Format (ruff)
        if: ${{ !cancelled() }}
        run: uvx "$RUFF" format --check .

      # The pins in `env:` are a second copy of lint_gate.sh's. Two
      # hand-maintained copies drift, and the failure mode is the round trip
      # this workflow exists to prevent: the local gate formats under one ruff,
      # CI checks under another, and a PR reds on code the author's hook just
      # called clean. Assert instead of asking a comment to hold the line.
      - name: Tool pins match the local gate
        if: ${{ !cancelled() }}
        run: |
          grep -q "RUFF=\"$RUFF\"" .claude/hooks/lint_gate.sh
          grep -q "TY=\"$TY\"" .claude/hooks/lint_gate.sh

      # --locked fails when uv.lock is stale against pyproject.toml instead of
      # silently re-resolving. The two checks below need the environment: ty
      # resolves third-party imports through .venv, and the drift check imports
      # the agent to read the tool bindings it actually has.
      - name: Install (locked)
        id: sync
        run: uv sync --locked

      # Gated on the install so a failed sync surfaces as an install failure
      # rather than a wall of unresolved-import findings against fine source.
      - name: Types (ty)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uvx "$TY" check

      # check_prompt_drift.py is a PostToolUse hook: it reads a Claude Code
      # payload on stdin and returns 0 for any file outside its TRIGGERS tuple.
      # Running it and seeing 0 therefore proves nothing by itself — the same
      # payload naming README.md exits 0 against a tree full of drift.
      #
      # So prove the gate is live before trusting its verdict: point it at a
      # tree with drift planted in it and require a failure. That covers a
      # stale path below AND a restructured TRIGGERS, neither of which a grep
      # for the literal string would catch.
      - name: Prompt/tool drift
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        env:
          PAYLOAD: '{"tool_input":{"file_path":"src/event_planner/prompts.py"}}'
        run: |
          canary="$RUNNER_TEMP/drift-canary"
          mkdir -p "$canary/workspace/skills/canary"
          # The backticks are the point, not an accident: the hook's TOKEN
          # regex only matches names written as `like_this`, so an unquoted
          # canary name would be invisible to it and the probe would pass.
          # shellcheck disable=SC2016
          printf -- '---\nname: canary\n---\nCall `definitely_not_a_tool` now.\n' \
            > "$canary/workspace/skills/canary/SKILL.md"

          if printf '%s' "$PAYLOAD" | CLAUDE_PROJECT_DIR="$canary" \
              uv run python .claude/hooks/check_prompt_drift.py
          then
            echo "::error::drift gate accepted planted drift — the check is not running"
            exit 1
          fi

          printf '%s' "$PAYLOAD" | CLAUDE_PROJECT_DIR="$GITHUB_WORKSPACE" \
            uv run python .claude/hooks/check_prompt_drift.py

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One version failing should not hide the state of the others.
      fail-fast: false
      matrix:
        # Every version in the declared range (requires-python >=3.11,<4.0),
        # not a subset. uv.lock splits dependencies at BOTH 3.13
        # (typing-extensions is a dependency below it and absent at or above)
        # and 3.14 (the resolution markers), so no two of these are reliably
        # interchangeable — and CLAUDE.md's note on @override needing
        # typing_extensions at the floor turns on exactly that split.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sets UV_PYTHON, which takes precedence over .python-version, so the
      # install and the run below cannot disagree about the interpreter.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install (locked)
        run: uv sync --locked

      # No secrets are passed, deliberately. The suite is offline by design —
      # the model is faked in conftest.py and the tools it exercises are stubs.
      # If it ever needs ANTHROPIC_API_KEY or TAVILY_API_KEY to go green, that
      # is the regression, not a CI misconfiguration.
      - name: Tests
        run: uv run pytest -q
