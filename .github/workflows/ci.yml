# CI runs the checks that fire locally as Claude Code PostToolUse hooks (see
# .claude/hooks/README.md), so a contributor without Claude Code gets the same
# feedback the author gets at edit time:
#
#   ruff check           lint_gate.sh
#   ruff format --check  lint_gate.sh
#   ty check             lint_gate.sh  — scoped to the edited file locally,
#                                        whole-project here
#   pytest               test_gate.sh
#
# It does NOT stand in for protect_files.sh, the one remaining PreToolUse
# guard, which blocks writes rather than inspecting them. .claude/hooks/README.md
# records why a pull request has no equivalent.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseding an in-flight run is free on a pull request. Not on main: the
  # README badge reports the default branch, so cancelling there can leave the
  # badge reading "cancelled" on a commit that was never actually verified.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No job writes to the repo, comments on a PR, or publishes an artifact.
permissions:
  contents: read

env:
  # Must match .claude/hooks/lint_gate.sh, which pins the same two versions for
  # the reason recorded there: an upstream release must not redden CI on code
  # nobody touched. These are a second copy of those pins, so the static job
  # asserts the two agree rather than trusting a comment to keep them in step.
  RUFF: ruff@0.16.1
  TY: ty@0.0.65

jobs:
  static:
    name: lint · format · types
    runs-on: ubuntu-latest
    # The slowest step here is the install; the checks are milliseconds. This
    # is a stuck-runner backstop, not a budget.
    timeout-minutes: 10
    steps:
      # Actions are pinned to the commit behind the release tag — the form
      # upstream's own README uses. Not a major-only ref: setup-uv publishes
      # v9.0.0 but no floating v9, so `@v9` fails to resolve and every job
      # aborts before doing any work. A SHA also cannot be force-moved.
      #
      # persist-credentials: false because nothing here uses git after the
      # checkout — no push, no tags, no submodules, and hatchling reads a static
      # version. The default writes the job's GITHUB_TOKEN into .git/config as an
      # http.extraheader, and the steps below then run third-party build backends
      # (`uv sync`) and tool installs (`uvx`) in that same workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No python-version here: uv reads .python-version (3.14) and provisions
      # that interpreter itself. Caching needs no configuration — enable-cache
      # defaults to "auto", which resolves to true on GitHub-hosted runners,
      # and the default cache-dependency-glob already covers uv.lock.
      #
      # `id:` because `Format` and `Install` below run on `!cancelled()`, so one
      # red check cannot hide the next — but that alone would also run them with
      # no repo and no uv, and `ruff format --check` on an empty tree exits 0.
      # This step is `success()`-gated, so gating on it covers both
      # prerequisites at once.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        id: setup

      # Both ruff steps run BEFORE the install, deliberately: ruff goes through
      # uvx in an isolated environment and never touches .venv. A stale
      # lockfile is the likeliest reason this job fails, and it should not also
      # cost the contributor their lint and format feedback.
      - name: Lint (ruff)
        run: uvx "$RUFF" check .

      # --check never writes; it exits non-zero on any file `ruff format` would
      # change. Runs even when the linter is red so one cannot hide the other.
      - name: Format (ruff)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uvx "$RUFF" format --check .

      # The `env:` pins are a second copy of lint_gate.sh's, and two
      # hand-maintained copies drift into the round trip this workflow exists to
      # prevent: the local gate formats under one ruff, CI checks under another.
      # `ruff format --check` above is not a fallback — 0.16.1 and 0.16.5 format
      # this tree identically, so ruff drift stays green; ty, pre-1.0 with a
      # moving diagnostic set, is what this really guards. -x -F because an
      # unanchored match also passes on a commented-out `# was RUFF="..."` line,
      # and both pins report before exiting, so a double mismatch costs one run.
      #
      # `!cancelled()` alone, deliberately not gated on setup-uv like its
      # neighbours: this is a grep that needs neither uv nor the network, and a
      # setup flake should not also cost the one check written to catch a
      # drifted pin. The unreadable-file branch covers the no-checkout case.
      - name: Tool pins match the local gate
        if: ${{ !cancelled() }}
        run: |
          hook=.claude/hooks/lint_gate.sh
          [ -r "$hook" ] || { echo "cannot read $hook" >&2; exit 1; }
          grep -qxF "RUFF=\"$RUFF\"" "$hook" || { echo "$hook disagrees with RUFF=$RUFF" >&2; bad=1; }
          grep -qxF "TY=\"$TY\"" "$hook" || { echo "$hook disagrees with TY=$TY" >&2; bad=1; }
          [ -z "${bad:-}" ]

      # --locked fails when uv.lock is stale against pyproject.toml instead of
      # silently re-resolving. The one check below needs the environment: ty
      # resolves third-party imports through .venv.
      - name: Install (locked)
        id: sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv sync --locked

      # Gated on the install so a failed sync surfaces as an install failure
      # rather than a wall of unresolved-import findings against fine source.
      - name: Types (ty)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uvx "$TY" check

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One version failing should not hide the state of the others.
      fail-fast: false
      matrix:
        # Every version in the declared range (requires-python >=3.11,<4.0).
        # These legs test the interpreter support the project claims, NOT the
        # dependency set — the lockfile would justify only two of them:
        #
        #   uv export --frozen --no-emit-project --no-hashes | grep python_full_version
        #
        # returns numpy and nothing else, split at 3.12. So 3.12, 3.13 and 3.14
        # install identical packages; uv.lock's fork at 3.14 resolves to nothing
        # distinct, and its `< '3.13'` markers are typing-extensions edges, not
        # a presence boundary — nine packages require it unconditionally.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sets UV_PYTHON, which takes precedence over .python-version, so the
      # install and the run below cannot disagree about the interpreter.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install (locked)
        run: uv sync --locked

      # No secrets are passed, deliberately. The suite is offline by design —
      # the model is faked in conftest.py and the tools it exercises are stubs.
      # If it ever needs ANTHROPIC_API_KEY or TAVILY_API_KEY to go green, that
      # is the regression, not a CI misconfiguration.
      - name: Tests
        run: uv run pytest -q

  # `langgraph.json` declares `"dependencies": ["."]` — a plain install, no
  # extras and no dev group — while every job above runs `uv sync --locked`,
  # which pulls the dev group and with it streamlit: 98 packages against 65.
  # So a module-scope `import streamlit` anywhere in src/ passes ruff, ty and
  # all four pytest legs, and breaks only the deployed graph.
  #
  # `--no-editable` matters as much as `--no-dev`: `uv sync` installs the
  # project itself editable by default, which leaves PROJECT_ROOT pointing at
  # the checkout and the install only half the shape it claims to be.
  #
  # This is the one check here that cannot be a test. pytest runs inside the dev
  # environment and cannot conjure one without it; the environment IS the check,
  # which is why it is a job rather than a case in tests/.
  deploy-shape:
    name: deployed graph imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install (deploy shape)
        run: uv sync --locked --no-dev --no-editable

      # --no-sync, or `uv run` restores the dev group and the check passes
      # vacuously. The streamlit assertion is what makes that failure loud
      # rather than silent, so keep it even though it looks redundant.
      #
      # The skills assertion is the one pytest structurally cannot make. A
      # checkout cannot tell a package-relative root from one derived by
      # counting levels up from __file__, because in a checkout both land on a
      # real directory; only an installed copy separates them. That is the
      # environment this job exists to be, so this is where that fix is pinned.
      - name: The deployed graph imports, with its skills
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.util as util

          assert util.find_spec("streamlit") is None, "the dev group leaked into the deploy install"

          import event_planner.agent
          import event_planner.cli
          import event_planner.webui

          workspace = event_planner.agent.WORKSPACE
          assert workspace.is_dir(), f"the installed copy carries no workspace: {workspace}"

          backend = event_planner.agent.build_backend()
          skills = [e["path"] for e in (backend.ls("/skills/").entries or [])]
          assert skills, "the installed copy resolved no skills"

          refusal = backend.write("/evil.py", "x").error
          assert refusal, "the shared root is writable in the deployed shape"

          print(f"deployed graph imports; skills={len(skills)}; shared root read-only")
          PY
